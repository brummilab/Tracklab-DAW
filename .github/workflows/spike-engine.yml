name: spike-engine

# Engine spike M0-06 (JUCE + Tracktion Engine). Builds spike/engine on Linux (GCC, Clang) and Windows (MSVC),
# Debug and Release, runs the CTest suites and compares the MP3 decoding across platforms.
# Separate from gate.yml: the gate stays unchanged until M0-07.

on:
  workflow_dispatch:
    inputs:
      xvfb:
        description: "Run the Linux tests under xvfb-run (to find out whether the VST3 test needs a display)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "spike/**"
      - ".github/workflows/spike-engine.yml"

permissions:
  contents: read

concurrency:
  group: spike-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  # A missing lame/ffmpeg is a failure in CI, never a silent skip.
  SPIKE_REQUIRE_TOOLS: "1"
  # Only the two pinned submodules; Tracktion's own nested JUCE submodule is never initialised.
  SPIKE_SUBMODULES: spike/engine/third_party/JUCE spike/engine/third_party/tracktion_engine

jobs:
  mp3-fixture:
    # Encodes the MP3 once; every build job decodes the same file (the encoder version does not matter).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install lame
        run: sudo apt-get update && sudo apt-get install -y lame
      - name: Create fixture (synthetic, not committed)
        run: python3 spike/engine/tests/fixtures-gen/make_mp3_fixture.py mp3-fixture
      - uses: actions/upload-artifact@v4
        with:
          name: mp3-fixture
          path: mp3-fixture/fixture.mp3
          retention-days: 7

  build:
    needs: mp3-fixture
    name: ${{ matrix.platform }} ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-gcc, linux-clang, windows-msvc]
        config: [Debug, Release]
        include:
          - platform: linux-gcc
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - platform: linux-clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - platform: windows-msvc
            os: windows-2025
            cc: cl
            cxx: cl
    steps:
      - uses: actions/checkout@v4

      - name: Submodules (JUCE 9.0.3, Tracktion develop; not recursive)
        shell: bash
        run: git submodule update --init --depth 1 -- $SPIKE_SUBMODULES

      #-- Linux ---------------------------------------------------------------------------------
      - name: Install build dependencies (apt, JUCE "Linux Dependencies" + tools)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang lame ffmpeg xvfb \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev libegl-dev
      - name: ccache
        if: runner.os == 'Linux'
        uses: hendrikmuhs/ccache-action@v1.2.9
        with:
          key: spike-${{ matrix.platform }}-${{ matrix.config }}
          max-size: 1500M

      #-- Windows -------------------------------------------------------------------------------
      - name: Install lame and ffmpeg (choco)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install lame ffmpeg -y --no-progress
      - name: sccache
        if: runner.os == 'Windows'
        uses: Mozilla-Actions/sccache-action@v0.0.9
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      #-- Configure / build -----------------------------------------------------------------------
      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export SCCACHE_GHA_ENABLED=true
            LAUNCHER=sccache
          else
            LAUNCHER=ccache
          fi
          cmake -S spike/engine -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_COMPILER_LAUNCHER=$LAUNCHER -DCMAKE_CXX_COMPILER_LAUNCHER=$LAUNCHER
      - name: Build (spike_cli, SpikeGain.vst3, spike_tests)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export SCCACHE_GHA_ENABLED=true; fi
          start=$(date +%s)
          cmake --build build --parallel
          elapsed=$(( $(date +%s) - start ))
          {
            echo "### ${{ matrix.platform }} ${{ matrix.config }}"
            echo "- build time: ${elapsed} s"
            echo "- runner: $RUNNER_OS $RUNNER_ARCH, $(nproc 2>/dev/null || echo "$NUMBER_OF_PROCESSORS") cores"
            echo "- build dir size: $(du -sh build | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cache statistics
        if: always()
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then sccache --show-stats || true; else ccache -s || true; fi

      #-- Tests ---------------------------------------------------------------------------------
      - name: CTest
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ] && [ "${{ inputs.xvfb }}" = "true" ]; then
            xvfb-run -a ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
          else
            ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
          fi

      #-- MP3 platform comparison input ---------------------------------------------------------
      - uses: actions/download-artifact@v4
        with:
          name: mp3-fixture
          path: mp3-fixture
      - name: Decode the shared MP3 fixture
        shell: bash
        run: |
          mkdir -p pcm
          build/spike_cli dump-pcm mp3-fixture/fixture.mp3 --out pcm/decoded.f32
      - uses: actions/upload-artifact@v4
        with:
          name: pcm-${{ matrix.platform }}-${{ matrix.config }}
          path: pcm/decoded.f32
          retention-days: 7

      #-- Artefacts -----------------------------------------------------------------------------
      - uses: actions/upload-artifact@v4
        with:
          name: spike-${{ matrix.platform }}-${{ matrix.config }}
          path: |
            build/spike_cli
            build/spike_cli.exe
            build/SpikeGain_artefacts/${{ matrix.config }}/VST3/SpikeGain.vst3
          if-no-files-found: error
          retention-days: 14

  mp3-compare:
    # Windows vs Linux (and GCC vs Clang, Debug vs Release): same MP3, sample-equal or deviation reported.
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pcm-*
          path: pcm
      - name: Compare decodings
        shell: bash
        run: |
          {
            echo "### MP3 decoding: platform comparison"
            python3 spike/engine/tests/mp3_platform_compare.py \
              pcm/pcm-linux-gcc-Release/decoded.f32 \
              pcm/pcm-linux-gcc-Debug/decoded.f32 \
              pcm/pcm-linux-clang-Release/decoded.f32 \
              pcm/pcm-linux-clang-Debug/decoded.f32 \
              pcm/pcm-windows-msvc-Release/decoded.f32 \
              pcm/pcm-windows-msvc-Debug/decoded.f32
          } | tee -a "$GITHUB_STEP_SUMMARY"
