name: gate

# One workflow for the whole gate (DESIGN section 8). Every job calls scripts/gate.sh or scripts/gate.ps1, so the
# same checks run locally and in CI:
#   static             required files, secrets, audio files, clang-format
#   build-test-linux   CMake Debug + Release with GCC and Clang 18, ctest; clang-tidy on the Clang Debug leg
#   rtsan-linux        RealtimeSanitizer (Clang >= 20, Linux only) over the engine tests, see docs/realtime.md
#   build-test-windows CMake Debug + Release with MSVC, ctest
#   mp3-compare        MP3 decoding compared across platforms (engine spike M0-06)
# Packaging and release get their own workflows in later cards.
#
# Saving Actions minutes (E44, E46): the local gate (scripts/gate.sh all) is mandatory before every merge, CI only
# re-checks. A push runs CI only on main and only when something besides team records and documentation changed.

on:
  push:
    branches: [main]
    paths-ignore:
      - "team/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      xvfb:
        description: "Run the Linux tests under xvfb-run (to find out whether the VST3 test needs a display)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  # A newer manual run on another branch replaces the running gate; on main every commit keeps its own run and artefacts.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # A missing lame/ffmpeg is a failure in CI, never a silent skip (gate.sh sets it as well).
  SPIKE_REQUIRE_TOOLS: "1"
  # Only the pinned submodules (JUCE, Tracktion, nlohmann/json, json-schema-validator); Tracktion's own nested JUCE is never initialised.
  TRACKLAB_SUBMODULES: third_party/JUCE third_party/tracktion_engine third_party/nlohmann_json third_party/json-schema-validator
  # apt must never wait for input or a stalled mirror: no debconf/needrestart prompts, short network timeouts with
  # retries (a job once hung for more than 25 minutes in the apt step); the apt steps also have a timeout-minutes.
  APT_GET: sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
  # JUCE "Linux Dependencies" without WebKit, plus the tools the tests need.
  LINUX_PACKAGES: >-
    ninja-build lame ffmpeg xvfb
    libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev
    libfreetype-dev libfontconfig1-dev
    libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev
    libglu1-mesa-dev mesa-common-dev libegl-dev

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        timeout-minutes: 10
        run: $APT_GET update && $APT_GET install -y clang-format-18
      - name: Gate static
        run: bash scripts/gate.sh static
        env:
          CLANG_FORMAT: clang-format-18

  mp3-fixture:
    # Encodes the MP3 once; every build job decodes the same file (the encoder version does not matter).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install lame
        timeout-minutes: 10
        run: $APT_GET update && $APT_GET install -y lame
      - name: Create fixture (synthetic, not committed)
        run: python3 spike/engine/tests/fixtures-gen/make_mp3_fixture.py mp3-fixture
      - uses: actions/upload-artifact@v4
        with:
          name: mp3-fixture
          path: mp3-fixture/fixture.mp3
          retention-days: 7

  build-test-linux:
    needs: [static, mp3-fixture]
    name: linux-${{ matrix.compiler }} ${{ matrix.config }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        config: [debug, release]
        include:
          # GCC 14 and Clang 18 are preinstalled on ubuntu-24.04 (DESIGN section 8).
          - compiler: gcc
            cc: gcc-14
            cxx: g++-14
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
    env:
      GATE_COMPILER: ${{ matrix.compiler }}
      GATE_CONFIGS: ${{ matrix.config }}
      GATE_CC: ${{ matrix.cc }}
      GATE_CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Build directory (outside the checkout)
        run: echo "GATE_BUILD_DIR=$RUNNER_TEMP/gate-build" >> "$GITHUB_ENV"

      - name: Submodules (JUCE 9.0.3, Tracktion develop; not recursive)
        run: git submodule update --init --depth 1 -- $TRACKLAB_SUBMODULES

      - name: Install build dependencies (apt)
        timeout-minutes: 10
        run: |
          $APT_GET update
          $APT_GET install -y $LINUX_PACKAGES clang-18 clang-tidy-18 clang-format-18
      - name: ccache
        # v1.2.24: node24, @actions/cache 6 (v1.2.9 used the retired legacy cache service). One cache per
        # compiler and configuration (Debug and Release objects never match).
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: gate-linux-${{ matrix.compiler }}-${{ matrix.config }}
          max-size: 1500M

      - name: Gate build (configure, build, ctest)
        run: |
          start=$(date +%s)
          if [ "${{ inputs.xvfb }}" = "true" ]; then
            xvfb-run -a bash scripts/gate.sh build
          else
            bash scripts/gate.sh build
          fi
          {
            echo "### linux-${{ matrix.compiler }} ${{ matrix.config }}"
            echo "- gate build + ctest: $(( $(date +%s) - start )) s"
            echo "- runner: $RUNNER_OS $RUNNER_ARCH, $(nproc) cores"
            echo "- build dir size: $(du -sh "$GATE_BUILD_DIR" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Gate tidy (clang-tidy, own sources only)
        if: matrix.compiler == 'clang' && matrix.config == 'debug'
        run: bash scripts/gate.sh tidy
        env:
          CLANG_TIDY: clang-tidy-18
      - name: Cache statistics
        if: always()
        run: ccache -s || true

      - name: Test reports and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-linux-${{ matrix.compiler }}-${{ matrix.config }}
          path: |
            ${{ env.GATE_BUILD_DIR }}/*/junit.xml
            ${{ env.GATE_BUILD_DIR }}/*.log
            ${{ env.GATE_BUILD_DIR }}/*/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

      #-- MP3 platform comparison input ---------------------------------------------------------
      - uses: actions/download-artifact@v4
        with:
          name: mp3-fixture
          path: mp3-fixture
      - name: Decode the shared MP3 fixture
        run: |
          mkdir -p pcm
          "$GATE_BUILD_DIR/linux-${{ matrix.compiler }}-${{ matrix.config }}/spike/engine/spike_cli" \
            dump-pcm mp3-fixture/fixture.mp3 --out pcm/decoded.f32
      - uses: actions/upload-artifact@v4
        with:
          name: pcm-linux-${{ matrix.compiler }}-${{ matrix.config }}
          path: pcm/decoded.f32
          retention-days: 7

      #-- Artefacts (test binaries of main, 14 days) ----------------------------------------------
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: spike-linux-${{ matrix.compiler }}-${{ matrix.config }}
          path: |
            ${{ env.GATE_BUILD_DIR }}/linux-${{ matrix.compiler }}-${{ matrix.config }}/spike/engine/spike_cli
            ${{ env.GATE_BUILD_DIR }}/linux-${{ matrix.compiler }}-${{ matrix.config }}/spike/engine/SpikeGain_artefacts/*/VST3/SpikeGain.vst3
          if-no-files-found: error
          retention-days: 14

  rtsan-linux:
    # RealtimeSanitizer needs Clang >= 20 (Linux only, E30). Pinned to clang-20 from noble-updates on ubuntu-24.04.
    # ubuntu-26.04 does not work yet: clang-20 uses libstdc++ 15 there, and Tracktion develop does not compile with it
    # (std::make_shared<AudioClipPlayhead>(): implicitly deleted default constructor because of
    # `std::atomic<State> state`, tracktion_AudioClipBase.h). Move back once Tracktion builds with libstdc++ 15 -
    # the same problem will hit Linux Mint 23 / Ubuntu 26.04 users (docs/realtime.md).
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      # In CI a missing Clang >= 20 is a failure, locally the stage is skipped.
      GATE_REQUIRE_RTSAN: "1"
      # scripts/rtsan.supp was verified with Clang 20.1.2 only; newer versions may report other frames.
      GATE_CLANG: clang-20
    steps:
      - uses: actions/checkout@v4
      - name: Build directory (outside the checkout)
        run: echo "GATE_BUILD_DIR=$RUNNER_TEMP/gate-build" >> "$GITHUB_ENV"
      - name: Submodules (JUCE 9.0.3, Tracktion develop; not recursive)
        run: git submodule update --init --depth 1 -- $TRACKLAB_SUBMODULES
      - name: Install build dependencies (apt)
        timeout-minutes: 10
        run: |
          $APT_GET update
          # clang-20 is the noble-updates package (Clang 20.1.2); runtime and symbolizer in the same version.
          $APT_GET install -y $LINUX_PACKAGES ccache clang-20 libclang-rt-20-dev llvm-20
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: gate-linux-rtsan
          max-size: 1500M
      - name: Gate rtsan
        run: bash scripts/gate.sh rtsan
      - name: Cache statistics
        if: always()
        run: ccache -s || true
      - name: Test reports and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-linux-rtsan
          path: |
            ${{ env.GATE_BUILD_DIR }}/*/junit.xml
            ${{ env.GATE_BUILD_DIR }}/*.log
            ${{ env.GATE_BUILD_DIR }}/*/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  build-test-windows:
    needs: [static, mp3-fixture]
    name: windows-msvc ${{ matrix.config }}
    runs-on: windows-2025
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    env:
      GATE_CONFIGS: ${{ matrix.config }}
      SCCACHE_GHA_ENABLED: "true"
      LAME_CACHE_REV: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Build directory (outside the checkout)
        shell: pwsh
        run: '"GATE_BUILD_DIR=$env:RUNNER_TEMP\gate-build" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV'

      - name: Submodules (JUCE 9.0.3, Tracktion develop; not recursive)
        shell: bash
        run: git submodule update --init --depth 1 -- $TRACKLAB_SUBMODULES

      # O-11: runs 37922244183 and 37925702615 failed here, before any build started. The choco package
      # "lame" downloads its ZIP over plain http from www.rarewares.org (LAME is LGPL; the package has
      # no mirror, "Unable to connect"), and the choco community feed answered 504 once for ffmpeg. The
      # tests need both tools (SPIKE_REQUIRE_TOOLS=1), so skipping is no option. Hence: (1) up to 3
      # attempts per package with 20 s / 40 s waits, a hard error after the last one; (2) the lame
      # binaries are cached so most runs never contact rarewares.org at all. ffmpeg is large and comes
      # from the choco feed, so it is only retried, not cached.
      # The cache key carries a manual revision: choco gives no version before installing, so bump
      # LAME_CACHE_REV when the lame package should be re-fetched. A cached copy that does not run
      # (--version fails) is ignored and lame is installed through choco again.
      - name: Restore lame cache
        id: lame-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\lame-cache
          key: lame-choco-${{ runner.os }}-${{ env.LAME_CACHE_REV }}
      - name: Install lame and ffmpeg (choco)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $waits = @(20, 40)

          function Install-ChocoPackage([string] $Package) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              # --execution-timeout keeps one hanging download from eating the whole step budget
              choco install $Package -y --no-progress --execution-timeout=240
              if ($LASTEXITCODE -eq 0) { return }
              if ($attempt -eq 3) { throw "choco install $Package failed after $attempt attempts (exit code $LASTEXITCODE)" }
              Write-Warning "choco install $Package failed (attempt $attempt, exit code $LASTEXITCODE); retrying in $($waits[$attempt - 1]) s"
              Start-Sleep -Seconds $waits[$attempt - 1]
            }
          }

          $cacheDir = Join-Path $env:RUNNER_TEMP 'lame-cache'
          $lameFromCache = $false
          $cached = if (Test-Path $cacheDir) { Get-ChildItem $cacheDir -Recurse -Filter lame.exe | Select-Object -First 1 }
          if ($cached) {
            $env:PATH = "$($cached.DirectoryName);$env:PATH"
            & $cached.FullName --version *> $null
            if ($LASTEXITCODE -eq 0) {
              $lameFromCache = $true
              $cached.DirectoryName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
              Write-Host "lame taken from cache: $($cached.FullName)"
            } else {
              Write-Warning 'cached lame does not run; installing it through choco'
            }
          }

          if (-not $lameFromCache) {
            Install-ChocoPackage 'lame'
            # Keep the unpacked package contents (lame.exe and companions) for the cache; the shim in
            # C:\ProgramData\chocolatey\bin is not enough on its own.
            $tools = Join-Path $env:ChocolateyInstall 'lib\lame\tools'
            if (-not (Test-Path $tools)) { throw "lame tools directory not found: $tools" }
            Remove-Item $cacheDir -Recurse -Force -ErrorAction SilentlyContinue
            Copy-Item $tools $cacheDir -Recurse
          }
          Install-ChocoPackage 'ffmpeg'
      - name: Save lame cache
        # Only after a fresh choco install (no exact cache hit); a failed job never stores a cache.
        if: steps.lame-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\lame-cache
          key: lame-choco-${{ runner.os }}-${{ env.LAME_CACHE_REV }}
      - name: sccache
        # v0.0.11: node24 (v0.0.9 ran on node20)
        uses: Mozilla-Actions/sccache-action@v0.0.11
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Gate build (configure, build, ctest)
        shell: pwsh
        run: |
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          ./scripts/gate.ps1 build
          $code = $LASTEXITCODE
          @(
            "### windows-msvc ${{ matrix.config }}",
            "- gate build + ctest: $([int]$sw.Elapsed.TotalSeconds) s",
            "- runner: $env:RUNNER_OS $env:RUNNER_ARCH, $env:NUMBER_OF_PROCESSORS cores"
          ) | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $code
      - name: Cache statistics
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Test reports and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-windows-msvc-${{ matrix.config }}
          path: |
            ${{ env.GATE_BUILD_DIR }}\*\junit.xml
            ${{ env.GATE_BUILD_DIR }}\*\Testing\Temporary\LastTest.log
          if-no-files-found: ignore
          retention-days: 14

      #-- MP3 platform comparison input ---------------------------------------------------------
      - uses: actions/download-artifact@v4
        with:
          name: mp3-fixture
          path: mp3-fixture
      - name: Decode the shared MP3 fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pcm | Out-Null
          & "$env:GATE_BUILD_DIR\windows-msvc-${{ matrix.config }}\spike\engine\spike_cli.exe" dump-pcm mp3-fixture/fixture.mp3 --out pcm/decoded.f32
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: pcm-windows-msvc-${{ matrix.config }}
          path: pcm/decoded.f32
          retention-days: 7

      #-- Artefacts (test binaries of main, 14 days) ----------------------------------------------
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: spike-windows-msvc-${{ matrix.config }}
          path: |
            ${{ env.GATE_BUILD_DIR }}\windows-msvc-${{ matrix.config }}\spike\engine\spike_cli.exe
            ${{ env.GATE_BUILD_DIR }}\windows-msvc-${{ matrix.config }}\spike\engine\SpikeGain_artefacts\*\VST3\SpikeGain.vst3
          if-no-files-found: error
          retention-days: 14

  mp3-compare:
    # Windows vs Linux (and GCC vs Clang, Debug vs Release): same MP3, sample-equal or deviation reported.
    needs: [build-test-linux, build-test-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pcm-*
          path: pcm
      - name: Compare decodings
        shell: bash
        run: |
          {
            echo "### MP3 decoding: platform comparison"
            reference=pcm/pcm-linux-gcc-debug/decoded.f32
            mapfile -t others < <(ls pcm/*/decoded.f32 | grep -v '/pcm-linux-gcc-debug/')
            python3 spike/engine/tests/mp3_platform_compare.py "$reference" "${others[@]}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
